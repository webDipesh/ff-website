<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4725544688367509"
        crossorigin="anonymous"></script>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FF Website - Register</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>


    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4725544688367509"
        crossorigin="anonymous"></script>
    <ins class="adsbygoogle" style="display:block" data-ad-format="fluid" data-ad-layout-key="-gq-3+1f-3d+2z"
        data-ad-client="ca-pub-4725544688367509" data-ad-slot="3414920766"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <main class="login-container">

        <section class="login-card">

            <h1>Create Account</h1>
            <p class="subtitle">Register for your FF account</p>

            <form action="/register" method="post">

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">

                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input id="password" name="password" type="password" autocomplete="new-password" required
                        minlength="8">

                    <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Show password">
                        👁
                    </button>
                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="register">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </section>

    </main>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const toggle = document.querySelector(".password-toggle");

            if (password.type === "password") {
                password.type = "text";
                toggle.textContent = "🙈";
                toggle.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                toggle.textContent = "👁";
                toggle.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>

</html>
