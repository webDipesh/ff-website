<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .notification {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .unread {
            border-left: 5px solid #ff9800;
        }

        .message {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .date {
            color: #777;
            font-size: 13px;
        }

        .read-btn {
            margin-top: 10px;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }
    </style>

</head>

<body>

    <header class="navbar">

        <div class="logo">
            FF Website
        </div>

        <nav>
            <a href="/dashboard">
                Dashboard
            </a>

        </nav>

    </header>


    <div class="container">

        <h1>🔔 Notifications</h1>


        <div class="empty" th:if="${notifications.isEmpty()}">

            No notifications yet.

        </div>


        <div th:each="notification : ${notifications}" class="notification"
            th:classappend="${!notification.readStatus} ? ' unread' : ''">

            <div class="message" th:text="${notification.message}">

                Notification message

            </div>

            <div class="date" th:text="${notification.createdAt}">

                Date

            </div>


            <form th:if="${!notification.readStatus}" th:action="@{/notifications/read}" method="post">

                <input type="hidden" name="id" th:value="${notification.id}">

                <button type="submit" class="read-btn">

                    Mark as Read

                </button>

            </form>

        </div>

    </div>

</body>

</html>
